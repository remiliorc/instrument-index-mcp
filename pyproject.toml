[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-index-mcp"
version = "0.1.0"
description = "MCP server giving AI agents read-only access to a (synthetic) plant instrument index"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
instrument-index-mcp = "instrument_index_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
